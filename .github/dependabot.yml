# Monthly pull requests with safe dependency updates (minor and patch versions, grouped into one PR per
# ecosystem). Major upgrades such as React 19, Vite 8 or ESLint 10 need code changes, so they are ignored
# here and done by hand on a separate branch.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      frontend-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      backend-minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
