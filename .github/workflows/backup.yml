# Weekly database backup. Neon's free plan only keeps a short restore window, so this keeps our own copy.
#
# The repository is public and anyone signed in to GitHub can download workflow artifacts,
# so the dump is ENCRYPTED with BACKUP_PASSPHRASE before upload. Without that passphrase the file is useless.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL       the same value Render uses
#   BACKUP_PASSPHRASE  a long random phrase. Keep a copy somewhere safe: without it no backup can be restored.
# Until both exist the job skips itself and stays green. How to restore: DEPLOYMENT_GUIDE.md, "Backups".
name: Weekly database backup

on:
  schedule:
    - cron: "17 21 * * 6"   # Sundays 02:47 India time
  workflow_dispatch: {}

permissions: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        id: check
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::Backups are off: add the DATABASE_URL and BACKUP_PASSPHRASE repository secrets to turn them on."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pg_dump
        if: steps.check.outputs.ready == 'true'
        run: |
          sudo apt-get install -y -qq postgresql-common > /dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y > /dev/null
          sudo apt-get install -y -qq postgresql-client-18 > /dev/null
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump and encrypt
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          url="${DATABASE_URL/postgresql+psycopg:/postgresql:}"   # the app's URL names its driver; pg_dump doesn't want that
          name="fitai-$(date -u +%Y-%m-%d).dump"
          mkdir -p out
          /usr/lib/postgresql/18/bin/pg_dump --format=custom --no-owner --no-privileges "$url" \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 3<<<"$BACKUP_PASSPHRASE" \
                  -o "out/$name.gpg"
          size=$(stat -c %s "out/$name.gpg")
          [ "$size" -gt 1000 ] || { echo "Backup looks empty ($size bytes)"; exit 1; }
          echo "Encrypted backup: $name.gpg ($size bytes)"

      - name: Keep for 30 days
        if: steps.check.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fitai-db-backup
          path: out/*.gpg
          retention-days: 30
          if-no-files-found: error
