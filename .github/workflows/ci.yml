# Runs on every push and pull request: backend lint + tests (SQLite and PostgreSQL),
# frontend lint + type-check + production build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitai
          POSTGRES_PASSWORD: fitai
          POSTGRES_DB: fitai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fitai" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        env:
          # empty for SQLite: the tests then use a throwaway SQLite file
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://fitai:fitai@localhost:5432/fitai_test' || '' }}
        run: python -m pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (ESLint)
        run: npm run lint
      - name: Type-check and build
        run: npm run build
