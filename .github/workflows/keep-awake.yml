# Render's free plan puts the API to sleep after 15 minutes without visitors, and the next
# visitor then waits about 40 seconds. This free GitHub job visits the health check every
# 10 minutes so it stays awake. One always-on service fits inside Render's free 750 hours a month.
# GitHub may run scheduled jobs a few minutes late, so an occasional slow first load can still happen.
name: Keep API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://fitai-api-nmtc.onrender.com/api/health; then exit 0; fi
            sleep 20
          done
          echo "API did not answer"; exit 1
