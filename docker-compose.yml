# FitAI — local/production-like stack.
#   cp backend/.env.example backend/.env   (add GEMINI_API_KEY + JWT_SECRET)
#   docker compose up --build              → http://localhost:8080
# With PostgreSQL instead of SQLite:
#   docker compose --profile postgres up --build   (and set DATABASE_URL, see DEPLOYMENT_GUIDE.md)
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/fitai.db}
      CORS_ORIGINS: http://localhost:8080
    volumes:
      - fitai-data:/data
    expose:
      - "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: fitai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitai-local-only}
      POSTGRES_DB: fitai
    volumes:
      - fitai-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitai"]
      interval: 5s
      retries: 10

volumes:
  fitai-data:
  fitai-pg:
