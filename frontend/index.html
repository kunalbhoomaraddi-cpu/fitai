<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitAI" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0D0C" />
    <meta name="description" content="FitAI: workouts, meals and a coach that knows your numbers." />
    <title>FitAI — Your AI Fitness Coach</title>
    <script>
      // Apply the saved appearance before the first paint (dark unless the person chose otherwise)
      try { var c = localStorage.getItem('fitai.theme'); if (c === 'light' || (c === 'system' && matchMedia('(prefers-color-scheme: light)').matches)) {
        document.documentElement.dataset.theme = 'light'; document.documentElement.classList.remove('dark');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#F2F4EF') } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
